    <script>
      <!--
        /*
        GitHub Pages doesn't support single-page applications.  This is a workaround.

        A broken link is directed to public/404.html.  It will have saved that link in session
        storage and redirected the browser to this file.  Therefore, if a link is found in
        session storage then it's transferred to the browser's history so that it's ready for
        React Router to handle.
        */

        const redirect = sessionStorage.redirect;
        const originalReferrer = sessionStorage.originalReferrer;

        if ((typeof redirect === "string") && (redirect !== window.location.pathname)) {
          if (typeof originalReferrer === "string") {
            // Expose the original referrer to the React app before we clear sessionStorage.
            window.history.replaceState({ originalReferrer }, "", redirect);
          }

          console.log("Found 404 redirect in session storage:  \"" + redirect + "\"; original referrer: \"" + originalReferrer + "\"");
        }

        delete sessionStorage.redirect;
        delete sessionStorage.originalReferrer;
      //-->
    </script>
