<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      <!--
        /*
        GitHub Pages doesn't support single-page applications.  This is a workaround.

        The current path is stored in session storage and the browser is redirected to
        index.html, which, in turn, checks session storage to see if a redirect has occurred
        and changes the browser history to allow React Router to handle it.
        */

        sessionStorage.redirect = location.pathname + location.search + location.hash;
        // Preserve the page that linked to the missing URL (may be empty).
        sessionStorage.originalReferrer = document.referrer;
        location.replace(location.origin);

        console.log("Redirecting to index.html with path:  \"" + sessionStorage.redirect + "\"; referrer: \"" + sessionStorage.originalReferrer + "\"");
      //-->
    </script>
  </head>
  <body>
    <!-- This page is a workaround for GitHub Pages Single Page Application routing -->
  </body>
</html>
